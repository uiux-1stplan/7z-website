No. 9–11 · Salah Al Din St · Al Khabaisi · Dubai · United Arab Emirates","ar":"مبنى البحار · معرض رقم 9–11 · شارع صلاح الدين · الخبيصي · دبي · الإمارات العربية المتحدة"}}]},{"n":3,"type":"management","title":{"en":"ELCON ARABIA MANAGEMENT STRUCTURE","ar":"الهيكل الإداري لإلكون العربية"},"kicker":{"en":"EXECUTIVE LEADERSHIP · I","ar":"القيادة التنفيذية · 01"},"people":[{"name":"TED WHITFIELD","role":{"en":"GENERAL MANAGER · FRICS","ar":"المدير العام · FRICS"},"bio":{"en":"Ted is a construction professional in Project Management, Quantity Surveying and construction financing with a background in international social housing. His association with Elcon spans several decades. He has been responsible for establishing many international and local joint ventures with Elcon to undertake large-scale housing and other system-built projects for governmental clients in many regions of the world. As General Manager of Elcon Arabia, he carries legal responsibility to the shareholders to ensure the business is governed in accordance with the statutory and legal requirements of Saudi Arabia. Within that framework, he is responsible for the functioning of the executive directors and managers and takes the lead role in all aspects of project bidding and project delivery.","ar":"تيد متخصص في قطاع الإنشاءات في إدارة المشاريع وحصر الكميات وتمويل الإنشاءات، وله خلفية في مشاريع الإسكان الاجتماعي الدولية. تمتد علاقته بإلكون لعقود، وخلالها شارك في تأسيس العديد من المشاريع المشتركة الدولية والمحلية لتنفيذ مشاريع إسكان واسعة النطاق ومشاريع إنشائية بالنظم الصناعية لجهات حكومية في مناطق متعددة حول العالم. وبصفته المدير العام لإلكون العربية، يتحمل المسؤولية القانونية أمام مساهمي الشركة لضمان إدارة الأعمال وفق المتطلبات النظامية والقانونية في المملكة العربية السعودية، كما يشرف على عمل المديرين التنفيذيين والمديرين ويتولى الدور القيادي في المناقصات وتسليم المشاريع."}},{"name":"ANWAR ABUSEEDO","role":{"en":"DEPUTY GENERAL MANAGER","ar":"نائب المدير العام"},"bio":{"en":"Anwar is a procurement professional who has spent decades working in the UAE and Saudi Arabia for leading construction companies. More recently, his experience has extended into construction project management in the retail and commercial sectors. During his association with the Al-Rasheed Group, Anwar worked closely with Ted Whitfield in presenting the Elcon System to Saudi institutions and prominent organisations. His role supports the General Manager across estimating, programming, procurement and project control, while acting as prime coordinator with company managers and external consultants engaged for project-related functions.","ar":"أنور متخصص في المشتريات ويتمتع بخبرة تمتد لعقود في الإمارات والسعودية مع شركات إنشاءات رائدة، وقد توسعت خبرته لاحقاً لتشمل إدارة مشاريع الإنشاء في قطاعي التجزئة والمشاريع التجارية. وخلال عمله مع مجموعة الراشد تعاون بشكل وثيق مع تيد ويتفيلد في تقديم نظام إلكون لعدد من المؤسسات والجهات السعودية البارزة. يدعم المدير العام في التقدير والبرمجة والمشتريات وضبط المشاريع، ويعمل كمنسق رئيسي بين مديري الشركة والاستشاريين الخارجيين المشاركين في وظائف المشروع المختلفة."}},{"name":"ALYINA AHMED","role":{"en":"DESIGN DIRECTOR · MArch · PGDIP · RIBA","ar":"مديرة التصميم · MArch · PGDIP · RIBA"},"bio":{"en":"Alyina Ahmed is a highly qualified architect and interior designer with considerable experience in residential and commercial design in the UK and UAE, where she is based in the Dubai office. She has extensive knowledge of the technical aspects of the Elcon System from several years of association with the company in the UK and UAE. Alyina is responsible for all aspects of project design. Her particular role involves “Elconisation” — adapting project designs to incorporate the unique features of the Elcon Building System — and the seamless coordination and integration of consultants within the design team for third-party approvals.","ar":"ألينا أحمد مهندسة معمارية ومصممة داخلية عالية التأهيل، تمتلك خبرة واسعة في التصميم السكني والتجاري في المملكة المتحدة والإمارات، وتعمل من مكتب دبي. لديها معرفة عميقة بالجوانب التقنية لنظام إلكون نتيجة سنوات من العمل مع الشركة في المملكة المتحدة والإمارات. تتولى مسؤولية جميع جوانب تصميم المشاريع، وبشكل خاص عملية “Elconisation” أي تكييف تصميم المشروع لاستيعاب الخصائص الفريدة لنظام إلكون، إضافة إلى تنسيق ودمج الاستشاريين ضمن فريق التصميم للحصول على اعتمادات الجهات الخارجية."},"image":"assets/media/image24.jpeg"}]},{"n":4,"type":"management","title":{"en":"ELCON ARABIA MANAGEMENT STRUCTURE","ar":"الهيكل الإداري لإلكون العربية"},"kicker":{"en":"BOARD & COMMERCIAL LEADERSHIP · II","ar":"مجلس الإدارة والقيادة التجارية · 02"},"people":[{"name":"RAMEZ AL RASHEED","role":{"en":"NON-EXEC DIRECTOR","ar":"مدير غير تنفيذي"},"bio":{"en":"Ramez is a highly respected senior member of the Al-Rasheed family with a background in many aspects of trading and development in Saudi Arabia over many decades. The family — and Ramez in particular — has a long association with the UK which led to links with the Elcon Group. He has been the driving force behind the establishment of Elcon Arabia. His role is effectively that of a de facto Chairman, providing advice and guidance to the General Manager on the running of the business and beyond. Ramez is held with great esteem and respect by all Board members and managers alike, and the Board members believe this attribute will contribute to the ultimate success of the company.","ar":"رامز عضو بارز ومحترم من عائلة الراشد، ويتمتع بخبرة تمتد لعقود في مجالات متعددة من التجارة والتطوير في المملكة العربية السعودية. وللعائلة، ورامز بشكل خاص، علاقات طويلة مع المملكة المتحدة أسهمت في بناء الروابط مع مجموعة إلكون. وقد كان القوة الدافعة وراء تأسيس إلكون العربية. يؤدي دوراً قريباً من دور رئيس مجلس إدارة فعلي، ويقدم المشورة والتوجيه للمدير العام في كل ما يتعلق بإدارة الأعمال وما يتجاوزها. ويحظى رامز بتقدير واحترام كبيرين من جميع أعضاء مجلس الإدارة والمديرين، ويرى أعضاء المجلس أن هذه المكانة ستسهم في النجاح النهائي للشركة."}},{"name":"ROGER BLACKBURN","role":{"en":"SALES & MARKETING · BSc (Hons) MRICS","ar":"المبيعات والتسويق · BSc (Hons) MRICS"},"bio":{"en":"Roger is a chartered surveyor and highly regarded specialist in UK planning and the residential sector. For more than ten years he has served as a Board Director of the Elcon Group and played a key role in securing construction projects. His services have been used by many UK residential development companies to add value to projects. His role in Elcon Arabia is to bring this experience to the Saudi housing market, with a focus on sales and marketing for the benefit of clients and the end-user communities created by Elcon Arabia projects.","ar":"روجر مسّاح قانوني وخبير بارز في التخطيط والقطاع السكني في المملكة المتحدة. عمل لأكثر من عشر سنوات كعضو مجلس إدارة في مجموعة إلكون ولعب دوراً محورياً في تأمين مشاريع إنشائية، كما استفادت من خبرته شركات تطوير سكني عديدة في بريطانيا لتعزيز قيمة مشاريعها. ويتمثل دوره في إلكون العربية في نقل هذه الخبرة إلى سوق الإسكان السعودي، مع التركيز على المبيعات والتسويق لخدمة العملاء والمجتمعات النهائية التي تنشئها مشاريع إلكون العربية."}},{"name":"IAN HALL","role":{"en":"COMMERCIAL DIRECTOR · BEng (Hons)","ar":"المدير التجاري · BEng (Hons)"},"bio":{"en":"Ian is a highly qualified engineer and business professional with a successful track record of starting and growing several manufacturing businesses in the UK and Middle East. His involvement with Elcon over the last 15 years has helped make significant improvements to the performance of Elcon’s factory equipment. As Commercial Director, his role is focused on driving revenue growth and maximizing profitability through commercial strategies, partnerships and new markets.","ar":"إيان مهندس ومحترف أعمال عالي التأهيل، وله سجل ناجح في تأسيس وتنمية عدة شركات تصنيع في المملكة المتحدة والشرق الأوسط. وقد أسهمت مشاركته مع إلكون خلال السنوات الخمس عشرة الماضية في تحقيق تحسينات كبيرة في أداء معدات مصانع إلكون. وبصفته المدير التجاري، يركز على دفع نمو الإيرادات وتعظيم الربحية من خلال تطوير الاستراتيجيات التجارية والشراكات واستكشاف أسواق جديدة."}}]},{"n":5,"type":"split","title":{"en":"WHO ARE ELCON GROUP?","ar":"من هي مجموعة إلكون؟"},"kicker":{"en":"TECHNOLOGY OWNER · SYSTEM EVOLUTION","ar":"مالك التقنية · تطور النظام"},"body":[{"en":"Elcon Group are the owner and technology provider for the patented precast concrete moulds that manufacture the unique L-shaped wall panels.","ar":"مجموعة إلكون هي مالك التقنية ومزوّد التكنولوجيا للقوالب الخرسانية مسبقة الصب المحمية ببراءات اختراع، والمستخدمة في تصنيع ألواح الجدران الفريدة على شكل L."},{"en":"The Elcon Building System was created by engineers and concrete technologists working with the UK Government’s Building Research Establishment during the 1960s. Elcon came into being as the operational company to market and license the technology developed jointly by Elcon’s engineers and the BRE.","ar":"تم تطوير نظام إلكون للبناء على يد مهندسين وخبراء تكنولوجيا خرسانة بالتعاون مع مؤسسة أبحاث البناء التابعة للحكومة البريطانية خلال ستينيات القرن الماضي. ثم تأسست شركة إلكون ككيان تشغيلي لتسويق وترخيص التقنية التي طورها مهندسو إلكون بالتعاون مع BRE."},{"en":"The existing shareholders purchased the technology, including all intellectual property rights and patents, in the 1990s. Constant improvements to the production moulds, equipment and concrete mixes have been made during the company’s current ownership.","ar":"اشترى المساهمون الحاليون التقنية، بما في ذلك حقوق الملكية الفكرية وبراءات الاختراع، خلال تسعينيات القرن الماضي. ومنذ ذلك الحين استمرت التحسينات على قوالب الإنتاج والمعدات وخلطات الخرسانة."},{"en":"In following decades, advances involving superplasticisers, reinforcement connections, high-bond grouting materials and curing methods were incorporated into the system, making it unique and a leader in system building.","ar":"وخلال العقود التالية تم إدماج تقنيات متقدمة تشمل الملدّنات الفائقة ووصلات التسليح ومواد الحقن عالية التماسك وأساليب المعالجة، مما جعل النظام فريداً ورائداً في مجال البناء بالنظم الصناعية."}],"media":"assets/media/image10.jpg"},{"n":6,"type":"global","title":{"en":"SITE LOCATIONS","ar":"مواقع التنفيذ حول العالم"},"kicker":{"en":"GLOBAL TRACK RECORD","ar":"حضور عالمي مثبت"},"body":[{"en":"On-site factory facilities and numerous buildings have been built in over 18 countries worldwide. Elcon has acted either as equipment and technology provider or as a joint venture partner managing the precast factory facility and erection of buildings.","ar":"تم إنشاء مرافق مصانع داخل مواقع المشاريع وتنفيذ مبانٍ عديدة في أكثر من 18 دولة حول العالم. وقد عملت إلكون إما كمزوّد للمعدات والتقنية أو كشريك في مشاريع مشتركة يدير مرافق الخرسانة مسبقة الصب وأعمال تركيب المباني."}],"countries":["USA","UK","Ireland","Russia","Ghana","Nigeria","Uganda","Saudi Arabia","Bahrain","Qatar","UAE","Iran","Iraq","Sri Lanka","Bangladesh","Malaysia","Mexico","South Sudan"]},{"n":7,"type":"partner","title":{"en":"WHO ARE AL AJIAL AL ARABIA?","ar":"من هي الأجيال العربية؟"},"kicker":{"en":"SAUDI PARTNER · LOCAL DELIVERY CAPABILITY","ar":"الشريك السعودي · قدرة تنفيذ محلية"},"body":[{"en":"Al Ajial Al Arabia is a leading Saudi construction company and a proud member of Al Rasheed Group — an established conglomerate with a legacy dating back to 1963. With decades of experience across civil engineering, electromechanical works, agriculture and electrical solutions, Al Rasheed Group is a trusted name in delivering high-quality infrastructure and development projects across the Kingdom.","ar":"الأجيال العربية شركة إنشاءات سعودية رائدة وعضو في مجموعة الراشد، وهي مجموعة عريقة تمتد جذورها إلى عام 1963. وبخبرة تمتد لعقود في الهندسة المدنية والأعمال الكهروميكانيكية والزراعة والحلول الكهربائية، تُعد مجموعة الراشد اسماً موثوقاً في تنفيذ مشاريع البنية التحتية والتطوير عالية الجودة في أنحاء المملكة."},{"en":"Specializing in civil construction and finishing works, Al Ajial Al Arabia brings deep-rooted knowledge of the Saudi market, proven project delivery capabilities and the backing of a solid group structure.","ar":"تتخصص الأجيال العربية في الإنشاءات المدنية وأعمال التشطيبات، وتقدم معرفة عميقة بالسوق السعودي وقدرات مثبتة في تنفيذ المشاريع مدعومة بهيكل مجموعة قوي."},{"en":"As a local partner, it provides the market knowledge, delivery capability and group backing required by international ventures seeking a successful regional presence.","ar":"وبصفتها شريكاً محلياً، توفر المعرفة بالسوق والقدرة التنفيذية والدعم المؤسسي الذي تحتاجه المشاريع الدولية الساعية إلى تأسيس حضور ناجح في المنطقة."}],"media":"assets/media/image18.jpeg"},{"n":8,"type":"chapter","title":{"en":"ELCON SYSTEM · BENEFITS AND DESIGN","ar":"نظام إلكون · المزايا والتصميم"},"kicker":{"en":"CHAPTER 02","ar":"الفصل 02"},"media":"assets/media/image19.jpg"},{"n":9,"type":"split","title":{"en":"WHAT MAKES THE ELCON BUILDING SYSTEM DIFFERENT?","ar":"ما الذي يميز نظام إلكون للبناء؟"},"kicker":{"en":"THE L-SHAPED PANEL · ON-SITE PRODUCTION","ar":"لوح على شكل L · إنتاج داخل الموقع"},"body":[{"en":"The innovation was to cast two flat panels together as one L-shaped panel, creating a load-bearing building element. In most situations the L shape does not require propping or supporting during erection, and horizontal panel-to-panel connections are not required.","ar":"الابتكار يتمثل في صب لوحين مسطحين معاً ليشكلا لوحاً واحداً على شكل L يعمل كعنصر إنشائي حامل. وفي معظم الحالات لا يحتاج هذا الشكل إلى تدعيم أثناء التركيب، كما لا يتطلب وصلات أفقية بين الألواح."},{"en":"Panels can be cast in large sizes — up to 25m² for normal storey heights — vastly reducing the number of joints compared with conventional flat-panel systems.","ar":"يمكن صب الألواح بمساحات كبيرة تصل إلى 25 م² في الارتفاعات الاعتيادية للطوابق، ما يقلل عدد الوصلات بشكل كبير مقارنة بأنظمة الألواح المسطحة التقليدية."},{"en":"The production facility can normally be established on the construction site, eliminating double handling and the need to transport panels over long distances.","ar":"يمكن عادةً إنشاء منشأة الإنتاج داخل موقع المشروع، مما يلغي المناولة المزدوجة والحاجة إلى نقل الألواح لمسافات طويلة."}],"media":"assets/media/image20.jpg","secondary":"assets/media/image19.jpg"},{"n":10,"type":"chapter","title":{"en":"BENEFITS OF THE ELCON SYSTEM","ar":"مزايا نظام إلكون"},"kicker":{"en":"PERFORMANCE STORY","ar":"قصة الأداء"},"media":"assets/media/image21.JPG"},{"n":11,"type":"benefit","title":{"en":"SPEED AND SIMPLICITY","ar":"السرعة والبساطة"},"kicker":{"en":"BENEFIT 01","ar":"الميزة 01"},"body":[{"en":"The worldwide usage of the Elcon system demonstrates its economic benefits in terms of speed and simplicity over comparable traditional buildings and precast flat-panel buildings.","ar":"يُظهر استخدام نظام إلكون حول العالم مزاياه الاقتصادية من حيث السرعة والبساطة مقارنة بالمباني التقليدية والمباني المصنوعة من الألواح الخرسانية المسطحة مسبقة الصب."}],"media":"assets/media/image21.JPG"},{"n":12,"type":"benefits_grid","title":{"en":"BENEFITS OF THE ELCON SYSTEM","ar":"مزايا نظام إلكون"},"kicker":{"en":"PROGRESSIVE PERFORMANCE · 01","ar":"أداء متراكم · 01"},"benefits":[{"en":"Speed & Simplicity","ar":"السرعة والبساطة"}],"body":[{"en":"The worldwide usage of the Elcon system demonstrates its economic benefits in terms of speed and simplicity over comparable traditional buildings and precast flat panel buildings.","ar":"يُظهر استخدام نظام إلكون حول العالم مزاياه الاقتصادية من حيث السرعة والبساطة مقارنة بالمباني التقليدية والمباني المصنوعة من الألواح الخرسانية المسطحة مسبقة الصب."}]},{"n":13,"type":"benefit","title":{"en":"SELF SUPPORTING","ar":"ذاتية الاستناد"},"kicker":{"en":"BENEFIT 02","ar":"الميزة 02"},"body":[{"en":"The panels are completely self-supporting. Site installation is achieved with a small number of operatives and a mobile crane, keeping erection simple, speedy and economical.","ar":"الألواح ذاتية الاستناد بالكامل، ويمكن تركيبها في الموقع بواسطة عدد محدود من العمال ورافعة متنقلة، ما يجعل عملية التركيب بسيطة وسريعة واقتصادية."}],"media":"assets/media/image21.JPG"},{"n":14,"type":"benefits_grid","title":{"en":"BENEFITS OF THE ELCON SYSTEM","ar":"مزايا نظام إلكون لواح وتُشكّل فتحات مسبقة لأعمال السباكة والتكييف في المرحلة الأولى."}},{"title":{"en":"METHODOLOGY","ar":"المنهجية"},"text":{"en":"CGI visuals demonstrate the construction details involved in forming the Elcon structure. A precast structure formed with Elcon L-shaped panels is considerably more rigid and requires substantially fewer connections and ties than conventional flat-panel structures.","ar":"توضح مشاهد CGI التفاصيل الإنشائية المستخدمة لتكوين هيكل إلكون. الهيكل مسبق الصب المكوّن من ألواح إلكون على شكل L أكثر صلابة بصورة ملحوظة ويحتاج إلى عدد أقل بكثير من الوصلات والروابط مقارنة بهياكل الألواح المسطحة التقليدية."}}],"media":"assets/media/image93.jpeg"},{"n":44,"type":"sequence","title":{"en":"ERECTION SEQUENCE · GROUND FLOOR","ar":"تسلسل التركيب · الطابق الأرضي"},"kicker":{"en":"TYPICAL VILLA · STAGE 01","ar":"فيلا نموذجية · المرحلة 01"},"steps":[{"en":"Conventional foundation constructed with starter bars","ar":"تنفيذ الأساسات التقليدية مع قضبان البداية"},{"en":"Elcon self-supporting L-shaped panels placed sequentially on packers and mortar bed with one mobile crane","ar":"وضع ألواح إلكون ذاتية الاستناد على شكل L بالتتابع فوق الفواصل وسرير المونة باستخدام رافعة متنقلة واحدة"},{"en":"Beams and infill panels over large openings are ledged onto pinned notches in adjacent panels","ar":"وضع الجسور وألواح الملء فوق الفتحات الكبيرة على نتوءات مثبتة في الألواح المجاورة"},{"en":"Staircase and landings inserted","ar":"تركيب الدرج والبسطات"},{"en":"Hollow-core floor planks placed with end bearings on perimeter Elcon panels; thickness determined by span between walls","ar":"وضع بلاطات الهولوكور مع ارتكاز النهايات على ألواح إلكون المحيطية، ويحدد السمك وفق البحر بين الجدران"},{"en":"High-tensile vertical continuity bars inserted into grout tubes and grouted; bars project 600–900mm above slab as starter bars for the next floor","ar":"إدخال قضبان استمرارية رأسية عالية الشد داخل أنابيب الحقن وحقنها؛ وتمتد القضبان 600–900 مم فوق البلاطة لتعمل كقضبان بداية للطابق التالي"}],"video":"assets/media/ground-floor-4k.mp4","poster":"assets/media/posters/ground-floor-4k.jpg"},{"n":45,"type":"sequence","title":{"en":"ERECTION SEQUENCE · 1ST FLOOR","ar":"تسلسل التركيب · الطابق الأول"},"kicker":{"en":"TYPICAL VILLA · STAGE 02","ar":"فيلا نموذجية · المرحلة 02"},"steps":[{"en":"Elcon self-supporting L-shaped panels placed in sequence on bedding compound","ar":"وضع ألواح إلكون ذاتية الاستناد على شكل L بالتتابع فوق مادة التأسيس"},{"en":"Beams and infill panels placed over large openings as on ground floor","ar":"تركيب الجسور وألواح الملء فوق الفتحات الكبيرة كما في الطابق الأرضي"},{"en":"Hollow-core floor planks placed in sequence with end bearings on perimeter Elcon panels","ar":"وضع بلاطات الهولوكور بالتتابع مع ارتكاز النهايات على ألواح إلكون المحيطية"},{"en":"High-tensile vertical continuity bars inserted and grouted; bars project 600–900mm above slab as starter bars for the next floor and roof parapets","ar":"إدخال قضبان الاستمرارية الرأسية عالية الشد وحقنها؛ وتمتد 600–900 مم فوق البلاطة لتصبح قضبان بداية للطابق التالي ودرابزينات السطح"},{"en":"Staircase and landings inserted","ar":"تركيب الدرج والبسطات"},{"en":"Parapet sections placed on the perimeter on bedding compound and over starter bars from panels below","ar":"وضع قطاعات الدرابزين المحيطي فوق مادة التأسيس وحول قضبان البداية القادمة من الألواح أسفلها"}],"video":"assets/media/first-floor-4k.mp4","poster":"assets/media/posters/first-floor-4k.jpg"},{"n":46,"type":"sequence","title":{"en":"ERECTION SEQUENCE · 2ND FLOOR AND ROOF","ar":"تسلسل التركيب · الطابق الثاني والسطح"},"kicker":{"en":"TYPICAL VILLA · STAGE 03","ar":"فيلا نموذجية · المرحلة 03"},"steps":[{"en":"Elcon self-supporting L-shaped panels placed in sequence on bedding compound","ar":"وضع ألواح إلكون ذاتية الاستناد على شكل L بالتتابع فوق مادة التأسيس"},{"en":"Beams and infill panels placed over large openings as on the ground floor","ar":"تركيب الجسور وألواح الملء فوق الفتحات الكبيرة كما في الطابق الأرضي"},{"en":"Parapet sections placed on perimeter on bedding compound and over starter bars from panels below","ar":"وضع قطاعات الدرابزين حول المحيط فوق مادة التأسيس وعلى قضبان البداية القادمة من الألواح أسفلها"},{"en":"Hollow-core roof planks placed in sequence with end bearings on perimeter Elcon panels","ar":"وضع بلاطات هولوكور السطح بالتتابع مع ارتكاز النهايات على ألواح إلكون المحيطية"},{"en":"High-tensile vertical continuity bars inserted and grouted; bars project 900mm above slab for insertion into parapet grout tubes","ar":"إدخال قضبان استمرارية رأسية عالية الشد وحقنها؛ وتمتد 900 مم فوق البلاطة لتدخل في أنابيب حقن الدرابزين"}],"video":"assets/media/second-floor-roof-4k.mp4","poster":"assets/media/posters/second-floor-roof-4k.jpg"},{"n":47,"type":"method","title":{"en":"METHODOLOGY · GROUND FLOOR","ar":"المنهجية · الطابق الأرضي"},"kicker":{"en":"PANEL PLACEMENT","ar":"تركيب الألواح"},"body":[{"en":"Elcon L-shaped panels are set on a mortar bed with packers for levelling, with starter bars located into grout tubes cast in the Elcon panel.","ar":"تُثبت ألواح إلكون على شكل L فوق سرير من المونة مع فواصل للميزان، وتدخل قضبان البداية في أنابيب الحقن المصبوبة داخل اللوح."},{"en":"A mobile crane with two erectors is required for placement. No propping is required.","ar":"تُستخدم رافعة متنقلة مع عاملَي تركيب لوضع الألواح، ولا يلزم أي تدعيم."},{"en":"A site engineer attends for panel levelling.","ar":"يتواجد مهندس الموقع لضبط مناسيب الألواح."},{"en":"Lintel beams over larger window openings are located in rebates at the panel edge and secured by dowels located into grout tubes in the beam.","ar":"توضع جسور العتب فوق فتحات النوافذ الكبيرة داخل تجاويف عند حافة اللوح وتثبت بواسطة مسامير تدخل في أنابيب الحقن داخل الجسر."},{"en":"Average panel erection rate is 4 per hour, equating to 6 hours per floor.","ar":"متوسط معدل تركيب الألواح هو 4 ألواح في الساعة، أي ما يعادل نحو 6 ساعات لكل طابق."}],"media":"assets/media/image97.jpeg","metrics":[["4",{"en":"Panels / hour","ar":"ألواح / ساعة"}],["6h",{"en":"Per floor","ar":"لكل طابق"}]]},{"n":48,"type":"method","title":{"en":"METHODOLOGY · GROUND FLOOR","ar":"المنهجية · الطابق الأرضي"},"kicker":{"en":"FLOOR PLANKS · BARS · GROUTING","ar":"البلاطات · القضبان · الحقن"},"body":[{"en":"Hollow-core floor planks are laid and bedded in the rebate at the top of Elcon perimeter wall panels. Four-metre high-tensile vertical continuity bars are inserted into full-height grout tubes in the wall, leaving 700mm protruding above plank level as starter bars for first-floor panels. Planks and tubes are fully grouted on completion.","ar":"تُوضع بلاطات الهولوكور داخل التجويف أعلى ألواح جدران إلكون المحيطية. وتُدخل قضبان استمرارية رأسية عالية الشد بطول 4 م داخل أنابيب الحقن الممتدة بكامل ارتفاع الجدار، مع بروز 700 مم فوق مستوى البلاطات لتعمل كقضبان بداية لألواح الطابق الأول. ويتم حقن البلاطات والأنابيب بالكامل عند الانتهاء."},{"en":"The planks are constrained and locked together by nibs on Elcon panels, so no peripheral ties are required; this speeds installation and avoids site cutting of planks.","ar":"تُقيد البلاطات وتُقفل معاً بواسطة نتوءات في ألواح إلكون، لذلك لا تُحتاج روابط محيطية، ما يسرّع التركيب ويلغي الحاجة لقص البلاطات في الموقع."},{"en":"A mobile crane with two erectors places the planks; the same erectors position vertical bars and carry out grouting.","ar":"تضع رافعة متنقلة مع عاملَي تركيب البلاطات، ويقوم نفس العاملين بوضع القضبان الرأسية وتنفيذ الحقن."},{"en":"Precast stair flights and landings are lowered into place and grouted after plank laying. Plank laying and grouting are completed in 8 hours.","ar":"يتم إنزال الدرج والبسطات مسبقة الصب إلى مواقعها وحقنها بعد تركيب البلاطات. ويكتمل تركيب البلاطات والحقن خلال 8 ساعات."},{"en":"Form slab and conventional in-situ floors are also suitable for use with the Elcon wall system.","ar":"كما يمكن استخدام البلاطات المصبوبة في الموقع والأرضيات التقليدية مع نظام جدران إلكون."}],"media":"assets/media/image98.jpeg","metrics":[["4m",{"en":"Continuity bars","ar":"قضبان الاستمرارية"}],["700mm",{"en":"Starter projection","ar":"بروز قضبان البداية"}],["8h",{"en":"Plank laying + grouting","ar":"تركيب البلاطات + الحقن"}]]},{"n":49,"type":"method","title":{"en":"METHODOLOGY · 1ST FLOOR","ar":"المنهجية · الطابق الأول"},"kicker":{"en":"VERTICAL CONTINUITY · TIGHT JOINTS","ar":"استمرارية رأسية · وصلات ضيقة"},"body":[{"en":"The procedure of placing Elcon L-shaped panels is repeated as for the ground floor. Levelling is checked because all walls are bedded on the level tops of ground-floor panels.","ar":"تتكرر إجراءات وضع ألواح إلكون على شكل L كما في الطابق الأرضي، مع التحقق من الميزان لأن الجدران ترتكز على الأسطح المستوية لألواح الطابق الأرضي."},{"en":"Elcon panels need no end-to-end horizontal connection because the panels are inherently stable due to their L shape and the vertical continuity bars that interlock panels vertically.","ar":"لا تحتاج ألواح إلكون إلى وصلات أفقية من طرف إلى طرف، لأن الألواح مستقرة بطبيعتها بسبب شكل L وقضبان الاستمرارية الرأسية التي تربط الألواح رأسياً."},{"en":"Abutting wall panels have tight narrow joints because there are no end connection devices. Joints are pointed with expanding mortar after placement.","ar":"تكون الفواصل بين الألواح المتجاورة ضيقة لعدم وجود أجهزة ربط طرفية، وتُعالج بمونة تمددية بعد التركيب."},{"en":"All floors are finished with a minimum 50mm reinforced structural topping, which also helps interlock the individual floor planks.","ar":"يتم إنهاء جميع الطوابق بطبقة إنشائية مسلحة لا تقل سماكتها عن 50 مم، ما يساهم أيضاً في ربط البلاطات الفردية معاً."}],"media":"assets/media/image99.jpeg","metrics":[["50mm",{"en":"Minimum structural topping","ar":"الحد الأدنى للطبقة الإنشائية"}]]},{"n":50,"type":"method","title":{"en":"METHODOLOGY · 2ND FLOOR AND TERRACED AREA","ar":"المنهجية · الطابق الثاني ومنطقة التراس"},"kicker":{"en":"ROOF PLANKS · PARAPET STARTERS","ar":"بلاطات السطح · قضبان بداية الدرابزين"},"body":[{"en":"Hollow-core roof planks are laid and bedded in the rebate at the top of Elcon perimeter wall panels.","ar":"تُوضع بلاطات هولوكور السطح داخل التجويف أعلى ألواح جدران إلكون المحيطية."},{"en":"3.75m high-tensile vertical continuity bars are inserted into full-height grout tubes in the Elcon wall, leaving 600mm protruding above plank level as starter bars for parapet sections. Planks and tubes are fully grouted on completion.","ar":"تُدخل قضبان استمرارية رأسية عالية الشد بطول 3.75 م داخل أنابيب الحقن الممتدة بكامل ارتفاع جدار إلكون، مع بروز 600 مم فوق مستوى البلاطات لتعمل كقضبان بداية لقطاعات الدرابزين. ويتم حقن البلاطات والأنابيب بالكامل عند الانتهاء."},{"en":"Planks are constrained and locked together by nibs on Elcon panels as on the floor below.","ar":"تُقيد البلاطات وتُقفل معاً بواسطة نتوءات ألواح إلكون كما في الطابق أسفلها."}],"media":"assets/media/image100.jpeg","metrics":[["3.75m",{"en":"Continuity bars","ar":"قضبان الاستمرارية"}],["600mm",{"en":"Parapet starter projection","ar":"بروز بداية الدرابزين"}]]},{"n":51,"type":"method","title":{"en":"METHODOLOGY · ROOF AREA","ar":"المنهجية · منطقة السطح"},"kicker":{"en":"PARAPETS · STRUCTURAL TOPPING","ar":"الدرابزين · الطبقة الإنشائية"},"body":[{"en":"Parapet panels are set on a mortar bed over starter bars. Parapets are connected to each other via galvanized steel ties set in slots and fully grouted.","ar":"تُثبت ألواح الدرابزين فوق سرير من المونة وعلى قضبان البداية، ويتم ربط قطاعات الدرابزين معاً بواسطة روابط فولاذية مجلفنة توضع داخل الفتحات وتُحقن بالكامل."},{"en":"All joints between parapet sections are jointed and pointed in epoxy mortar.","ar":"تتم معالجة جميع الفواصل بين قطاعات الدرابزين بمونة إيبوكسية."},{"en":"Roof planks are finished with a minimum 50mm reinforced structural topping. The topping can be lightweight insulating concrete to receive roof insulation and covering.","ar":"تُنهى بلاطات السطح بطبقة إنشائية مسلحة لا تقل سماكتها عن 50 مم. ويمكن أن تكون هذه الطبقة من خرسانة عازلة خفيفة الوزن لاستقبال عزل السطح وطبقاته النهائية."}],"media":"assets/media/image93.jpeg","metrics":[["50mm",{"en":"Minimum roof structural topping","ar":"الحد الأدنى للطبقة الإنشائية للسطح"}]]}];

function observe(){
 sceneObserver?.disconnect(); mediaObserver?.disconnect();
 sceneObserver=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');const n=+e.target.id.slice(1);updateActiveUI(n);e.target.querySelectorAll('video').forEach(v=>{hydrateVideo(v);v.play().catch(()=>{})});}else e.target.querySelectorAll('video').forEach(v=>v.pause());}),{rootMargin:'-24% 0px -54% 0px',threshold:0});
