let lang = localStorage.getItem('elconLang') || 'en';

const app=document.getElementById('app');
const t=v=>typeof v==='object'&&v!==null&&('en'in v)?v[lang]:v;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const img=(src,alt='')=>`<img src="${asset(src)}" alt="${esc(alt)}" loading="lazy" decoding="async">`;

const steps=(arr=[])=>`<div class="step-grid">${arr.map((x,i)=>`<div class="step"><i>${String(i+1).padStart(2,'0')}</i><span>${esc(t(x))}</span></div>`).join('')}</div>`;
function renderScene(s){
 let c=''; const idx=String(s.n).padStart(2,'0');
 if(s.type==='hero') c=`<div class="scene-inner"><div class="hero-layout"><div class="hero-copy"><img class="logo-mark reveal" src="${asset('assets/brand/elcon-arabia-logo-2k.jpeg')}" alt="ELCON Arabia"><div class="kicker reveal delay1">${esc(t(s.kicker))}</div><h1 class="title reveal delay1">${esc(t(s.title))}</h1><p class="lede reveal delay2">${esc(t(s.lead))}</p><div class="hero-tags reveal delay2"><span class="pill">UK × KSA</span><span class="pill">RIYADH Â· DUBAI Â· WOLVERHAMPTON</span><span class="pill">PATENTED PRECAST SYSTEM</span></div></div><div class="media-frame hero-media reveal delay1">${img(s.media,'Construction silhouette')}</div></div></div>`;

 else if(s.type==='management') c=`<div class="scene-inner">${title(s,true)}<div class="management-grid">${s.people.map(p=>`<article class="card person reveal">${p.image?img(p.image,p.name):`<div class="initial">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>`}<h3>${esc(p.name)}</h3><div class="role">${esc(t(p.role))}</div><p>${esc(t(p.bio))}</p></article>`).join('')}</div></div>`;
 else if(s.type==='split'||s.type==='partner') c=`<div class="scene-inner"><div class="split-grid"><div class="stack">${title(s,true)}${bodycopy(s.body)}${s.secondary?`<div class="media-frame reveal delay2">${img(s.secondary,t(s.title))}</div>`:''}</div><div class="media-frame reveal delay1">${img(s.media,t(s.title))}</div></div></div>`;
