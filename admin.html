<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7Z Magic Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css?v=20260712-checkup" />
  </head>
  <body>
    <main class="login-view" id="loginView">
      <form class="login-card" id="loginForm">
        <img src="media/main_logo/7ZLogo.jpg" alt="7Z Magic" />
        <p>7Z Magic Admin</p>
        <h1>Control Center</h1>
        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign In</button>
        <span class="status" id="loginStatus" role="status"></span>
      </form>
    </main>

    <main class="admin-shell is-hidden" id="adminView">
      <aside class="sidebar">
        <a class="admin-brand" href="/" target="_blank" rel="noopener">
          <img src="media/main_logo/7ZLogo.jpg" alt="" />
          <span>7Z Magic</span>
        </a>
        <nav>
          <button class="is-active" type="button" data-panel="analyticsPanel">Analytics</button>
          <button type="button" data-panel="mediaPanel">Media Library</button>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p>Admin Workspace</p>
            <h1 id="panelTitle">Analytics</h1>
          </div>
          <div class="topbar__actions">
            <span id="adminEmail"></span>
            <button type="button" id="logoutButton">Logout</button>
          </div>
        </header>

        <section class="panel" id="analyticsPanel">
          <div class="metrics" id="metrics"></div>
          <div class="analytics-grid">
            <article>
              <h2>Top Countries</h2>
              <div class="list" id="countryList"></div>
            </article>
            <article>
              <h2>Top Sections</h2>
              <div class="list" id="sectionList"></div>
            </article>
            <article>
              <h2>Devices</h2>
              <div class="list" id="deviceList"></div>
            </article>
            <article>
              <h2>Recent Visits</h2>
              <div class="visits" id="visitList"></div>
            </article>
          </div>
        </section>

        <section class="panel is-hidden" id="mediaPanel">
          <div class="media-toolbar">
            <label>
              Section
              <select id="sectionSelect"></select>
            </label>
            <button type="button" id="refreshMedia">Refresh</button>
          </div>

          <form class="media-form" id="addMediaForm">
            <h2>Add Media</h2>
            <div class="form-grid">
              <label>
                Title
                <input id="newTitle" name="title" type="text" placeholder="Video title" required />
              </label>
              <label>
                Layout
                <select id="newLayout" name="layout">
                  <option value="">Standard</option>
                  <option value="is-wide">Wide</option>
                  <option value="is-tall">Tall</option>
                </select>
              </label>
              <label>
                Media File
                <input id="newFile" name="file" type="file" accept="video/*,image/*" />
              </label>
              <label>
                Cover Image
                <input id="newPosterFile" name="posterFile" type="file" accept="image/*" />
              </label>
              <label>
                Or Media Path
                <input id="newSrc" name="src" type="text" placeholder="media/example.mp4" />
              </label>
              <label>
                Or Cover Path
                <input id="newPoster" name="poster" type="text" placeholder="media/cover.jpg" />
              </label>
            </div>
            <button type="submit">Add to Section</button>
            <span class="status" id="mediaStatus" role="status"></span>
          </form>

          <div class="media-list" id="mediaList"></div>
        </section>
      </section>
    </main>

    <script src="assets/js/admin.js?v=20260712-checkup"></script>
  </body>
</html>
